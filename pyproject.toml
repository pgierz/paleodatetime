[project]
name = "paleodatetime"
dynamic = ["version"]
description = "A datetime-like library for geological timescales supporting million-year ranges"
authors = [{name = "Paul Gierz"}]
requires-python = ">=3.9"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["datetime", "geology", "paleoclimate", "timescale", "xarray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/pgierz/paleodatetime"
Repository = "https://github.com/pgierz/paleodatetime"
Changelog = "https://github.com/pgierz/paleodatetime/blob/master/CHANGELOG.md"
Issues = "https://github.com/pgierz/paleodatetime/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "matplotlib>=3.5",
    "xarray>=2023.1.0",
    "netcdf4>=1.6.0",
]
plotting = [
    "matplotlib>=3.5",
]
xarray = [
    "xarray>=2023.1.0",
    "netcdf4>=1.6.0",
]

[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Single source of truth for the version: src/paleodatetime/__init__.py
[tool.setuptools.dynamic]
version = {attr = "paleodatetime.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tool.pixi.pypi-dependencies]
paleodatetime = { path = ".", editable = true }

[tool.pixi.dependencies]
python = ">=3.9"

[tool.pixi.feature.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
black = ">=23.0"
ruff = ">=0.1.0"
matplotlib = ">=3.5"
xarray = ">=2023.1.0"
netcdf4 = ">=1.6.0"

[tool.pixi.environments]
default = {solve-group = "default"}
dev = {features = ["dev"], solve-group = "default"}
