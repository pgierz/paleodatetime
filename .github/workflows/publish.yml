name: Publish

# Release flow
#   * Pushing a tag `vX.Y.Z` builds, tests, and publishes to PyPI, then
#     creates a GitHub release carrying the sdist and wheel.
#   * Running the workflow by hand ("Run workflow") does a dry run against
#     TestPyPI instead, so the publication path can be exercised at any time.
#
# Both targets use PyPI trusted publishing (OIDC) — no API tokens are stored.
# Each target has to be registered once on the index side:
#   https://pypi.org/manage/account/publishing/
#   https://test.pypi.org/manage/account/publishing/
# with owner `pgierz`, repository `paleodatetime`, workflow `publish.yml`,
# and environment `pypi` / `testpypi` respectively.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check --strict dist/*

      - name: Install the built wheel with dev extras
        run: python -m pip install "$(ls dist/*.whl)[dev]"

      - name: Check that the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(python -c 'import importlib.metadata as m; print(m.version("paleodatetime"))')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            echo "Bump __version__ in src/paleodatetime/__init__.py or re-tag."
            exit 1
          fi
          echo "Tag ${GITHUB_REF_NAME} matches package version."

      - name: Run the test suite against the installed wheel
        run: python -m pytest tests

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/paleodatetime
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/paleodatetime
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: Create GitHub release
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create release with distribution files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
